  - "asset tokenization"
  - "asset-backed token"
  - "security token"
  - "tokenized bond"
  - "tokenized loan"
  - "tokenized commodity"
  - "tokenized real estate"
  - "tokenized equity"
  - "collateral-backed"
  - "rwa collateral"
  - "rwa pricing"
  - "rwa risk"
  - "rwa lending"
  - "off-chain asset"
  - "on-chain asset"
  - "tokenization"

  # ---- DeFi 协议与机制 ----
  - "DeFi"
  - "decentralized finance"
  - "decentralized exchange"
  - "DEX"
  - "automated market maker"
  - "AMM"
  - "concentrated liquidity"
  - "liquidity pool"
  - "liquidity provider"
  - "liquidity mining"
  - "yield farming"
  - "impermanent loss"
  - "lending protocol"
  - "money market"
  - "collateralized debt"
