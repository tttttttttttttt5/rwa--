# ============================================================
# RWA 学术文献日报 —— 主配置文件
# 修改本文件后，下次运行（GitHub Actions / 本地）即自动生效
# 所有字段均可按需增删，脚本会做容错处理
# ============================================================

# ---------- 1. 关键词列表 ----------
# 每篇论文匹配的关键词越多，优先级越高（大小写不敏感，匹配标题+摘要）
# 覆盖：RWA 现实资产通证化 + DeFi 协议/机制/安全 + 加密资产金融 + 链上数据分析
