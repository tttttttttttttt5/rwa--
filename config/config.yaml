# ---------- 1b. 关键词分层权重 ----------
# 核心层（tier_core）每个命中 = 1.0 倍权重；辅助层（tier_aux）每个命中 = 0.4 倍权重
# 这样纯 AI/ML 论文（只命中辅助层）很难独自达标，必须与 RWA/DeFi 联合命中
keyword_tiers:
  tier_core:               # RWA + DeFi 核心词（高权重）
    - "RWA"
    - "real world asset"
    - "real-world asset"
    - "tokenized asset"
    - "asset tokenization"
    - "DeFi"
    - "decentralized finance"
