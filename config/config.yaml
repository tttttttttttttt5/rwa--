  - "perpetual future"
  - "perpetual"
  - "funding rate"
  - "synthetic asset"
  - "derivative"
  - "option"
  - "flash loan"
  - "flash swap"

  # ---- DeFi 风险 / 安全 / 治理 / 基础设施 ----
  - "MEV"
  - "maximal extractable value"
  - "cross-chain"
  - "bridge"
  - "wrapped asset"
  - "liquid staking"
  - "restaking"
  - "governance token"
  - "DAO"
  - "decentralized autonomous"
  - "smart contract"
  - "DeFi security"
  - "protocol risk"
  - "rug pull"
