  - "Ackerer"
  - "Schär"
  - "Bruno Biais"
  - "Lin William Cong"

# ---------- 2. 期刊 / 来源优先级 ----------
# JFE/JF/RFS/FRL = 顶档(1)；SSRN/NBER/arXiv 工作论文 = 次档(2)；其它 = 三档(3)
journal_priority:
  tier_1_journals:
    # 金融顶刊
    - "Journal of Finance"
    - "Journal of Financial Economics"
    - "Review of Financial Studies"
    - "Journal of Financial and Quantitative Analysis"
    - "Finance Research Letters"
    - "Journal of Financial Intermediation"
    - "Journal of Financial Economics"
    # AI/ML/量化顶刊 + 交叉
    - "Journal of Machine Learning Research"
    - "Journal of Financial Data Science"
    - "Journal of Computational Finance"
    - "Quantitative Finance"
    - "Journal of Financial Econometrics"
    - "Review of Asset Pricing Studies"
    - "Journal of Portfolio Management"
    - "Journal of Risk"
    - "Mathematical Finance"
  tier_2_journals:
    - "Management Science"
    - "Review of Finance"
    - "Journal of Banking and Finance"
    - "Journal of Financial Stability"
    - "Journal of Empirical Finance"
    - "Pacific Basin Finance Journal"
    - "Finance Research Letters"
    - "Digital Finance"
    - "Frontiers in Finance"
    - "Journal of Alternative Investments"
  source_tier:                  # 按数据源回退的档位
    arxiv: 2
    ssrn: 2
    nber: 2
    scholar: 3
  default_tier: 3
  tier_scores:
    1: 30
    2: 20
    3: 10

# ---------- 3. 评分阈值与分项权重 ----------
scoring:
  threshold: 55                 # 低于此分数的论文直接过滤（特殊关注作者除外）
  weights:                      # 合计 100
    keyword: 40
    journal: 30
    author: 20
    recency: 10
  keyword_full_at: 3            # 命中 3 个关键词即拿满 keyword 分
  author_bonus_per_hit: 10
  author_bonus_cap: 20
  recency:
    within_days_7: 10
    within_days_14: 5
    else: 0

# ---------- 4. AI 增强评分 ----------
# 把 enabled 改为 false 可完全不用 API key：
#   · 评分 = 纯规则（关键词/作者/期刊/时效）
#   · 每篇三段总结 + 导读 + 整体大总结 + 可借鉴要点 = 纯规则模板映射
#     （基于摘要切句 + 方法词典 + 可借鉴模板，见 src/rule_summary.py）
ai:
  enabled: false                # true = 接 Claude；false = 纯规则零 API（推荐）
  provider: "anthropic"
  model: "claude-3-5-sonnet-20241022"
  weight: 0.3                   # AI 分数在最终分数中的权重 (0~1)，ai.enabled=false 时忽略
  max_papers_to_score: 60      # 控制 API 成本，超过则只取规则分前 N 篇送 AI
  temperature: 0.0

# ---------- 5. 摘要风格 ----------
summary:
  style: "detailed"             # short | detailed | critical（仅 AI 导读生效）
  max_abstract_chars: 600
  enable_ai_digest: true        # 是否生成一句话中文导读（ai.enabled=false 时走规则版）
  enable_structured_summary: true  # 是否生成
                                   # “研究内容 / 方法 / 可借鉴”三段式结构化总结
                                   # （ai.enabled=false 时走规则版，无需 API）
  structured_summary_max_papers: 20  # 结构化总结的论文上限（控制 AI 成本或计算量）

# ---------- 6. 报告 ----------
report:
  top_picks: 2                  # 今日最值得精读的篇数
  include_citation_graph: true
  include_synthesis: true       # 整体大总结 + 可借鉴要点
                                # （ai.enabled=false 时走规则版，无需 API）
  save_dir: "reports"           # 本地保存目录（相对仓库根）

# ---------- 7. 邮件推送 ----------
notifications:
  email:
    enabled: true
    subject_prefix: "【RWA学术日报】"
    recipients:
      - "zhang200202409@126.com"   # ← 你的邮箱

# ---------- 8. 数据源 ----------
sources:
  arxiv:
    enabled: true
    categories:
      # 量化金融全分类
      - "q-fin.TR"       # Trading & Market Microstructure
      - "q-fin.CP"       # Computational Finance
      - "q-fin.GN"       # General Finance
      - "q-fin.MF"       # Mathematical Finance
      - "q-fin.PR"       # Pricing of Securities
      - "q-fin.RM"       # Risk Management
      - "q-fin.ST"       # Statistics
      - "q-fin.PM"       # Portfolio Management
      - "q-fin.EC"       # Economics
      # AI / ML / NLP（覆盖 AI 金融交叉论文）
      # 注：cs.AI/cs.LG 论文量巨大，靠核心关键词门禁过滤掉纯技术论文
      - "cs.AI"          # Artificial Intelligence
      - "cs.LG"          # Machine Learning
    lookback_days: 14
    max_results: 300
  nber:
    enabled: true
    lookback_days: 14
    feeds:
      - "https://www.nber.org/rss/feed/site/finance/rss.xml"
      - "https://www.nber.org/rss/feed/site/asset-pricing/rss.xml"
      - "https://www.nber.org/rss/feed/site/corporate-finance/rss.xml"
      - "https://www.nber.org/rss/feed/site/economic-fluctuations-growth/rss.xml"
  ssrn:
    enabled: true
    lookback_days: 14
    max_results: 80
    queries:
      # RWA / DeFi 方向
      - "RWA tokenization"
      - "real world assets"
      - "DeFi"
      - "tokenized assets"
      - "stablecoin"
      - "decentralized finance"
      # AI 金融 / 机器学习金融
      - "machine learning finance"
      - "deep learning asset pricing"
      - "AI financial markets"
      - "NLP finance"
      - "reinforcement learning trading"
      # 量化 / 算法交易
      - "quantitative trading"
      - "algorithmic trading"
      - "factor model"
      - "portfolio optimization"
  scholar:
    enabled: false              # 需额外配置 IMAP 邮箱接收 Google Scholar Alerts
    imap_host: "imap.gmail.com"
    imap_port: 993
    mailbox: "INBOX"
    sender_contains: "scholar.google"
    lookback_days: 14

# ---------- 9. 全局 ----------
lookback_days: 14
