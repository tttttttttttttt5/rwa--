    - "flash loan"
    - "DAO"
    - "smart contract"
    - "blockchain"
    - "crypto asset"
    - "crypto lending"
    - "digital asset"
  tier_aux:                # AI/ML/量化方法词（低权重，需与核心词联合）
    - "tokenization"        # 纯 "tokenization"（ML/推荐文本经常出现）不单独入选，须与 DeFi/RWA 联合
    - "oracle"              # 纯 "oracle"（ML 里常指 oracle 模型/上界）不单独入选，须与 DeFi/RWA 联合
    - "machine learning"
    - "deep learning"
    - "reinforcement learning"
    - "neural network"
    - "transformer"
    - "large language model"
    - "LLM"
    - "NLP"
    - "natural language processing"
    - "sentiment analysis"
    - "text mining"
    - "algorithmic trading"
    - "quantitative trading"
    - "quantitative finance"
    - "factor model"
    - "portfolio optimization"
    - "market prediction"
    - "price prediction"
    - "trading strategy"
    - "financial forecasting"
    - "time series forecasting"
    - "high-frequency trading"
    - "GNN"
    - "graph neural network"
    - "causal inference"
    - "credit risk"
